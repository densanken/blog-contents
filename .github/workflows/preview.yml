name: Preview
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: preview-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  # CI の preview-build ジョブがビルドした成果物を、静的ファイルとしてだけ扱い、プレビュー用の Worker にデプロイする
  # blog（厳格モード）も成功した実行だけを対象にする（危険なファイルを含みうるものを公開しない）
  # デプロイの設定（wrangler.jsonc）とスクリプトは default branch のものを使い、PR のファイルを実行しない
  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up sfw
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          install: false

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      # 古い実行の成果物で、新しいプレビューを上書きしない
      - name: Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { target } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview.ts`);
            await target({ github, context, core });

      - name: Download site
        if: steps.pr.outputs.number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Workers（無料プラン）の、1 バージョンあたりのファイル数の上限は 20,000
      - name: Check the number of files
        id: files
        if: steps.pr.outputs.number
        run: |
          count=$(find site -type f | wc -l)
          echo "files: $count"
          if [ "$count" -le 20000 ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy
        if: steps.files.outputs.deploy == 'true'
        run: pnpm exec wrangler preview --worker-name "$PREVIEW_WORKER" --name "pr-$PR_NUMBER"
        env:
          PREVIEW_WORKER: ${{ vars.PREVIEW_WORKER }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # URL は、ci.yml の preview-build ジョブがビルドに使った SITE_URL と同じ形
      - name: Comment
        if: steps.pr.outputs.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          URL: ${{ steps.files.outputs.deploy == 'true' && format('https://pr-{0}-{1}.{2}.workers.dev', steps.pr.outputs.number, vars.PREVIEW_WORKER, vars.PREVIEW_WORKERS_SUBDOMAIN) || '' }}
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview.ts`);
            await report({ github, context, core }, Number(process.env.PR_NUMBER), process.env.URL || undefined);
